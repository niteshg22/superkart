name: SuperKart MLOps Pipeline

# Runs on every push to main, on pull requests and on manual trigger
on:
  push:
    branches: [main]
    paths-ignore:
      - "model/**"          # avoid re-triggering when the pipeline commits the model
      - "README.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write            # needed so the last job can commit the trained model

jobs:
  data-registration:
    name: 1 - Data registration and validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate dataset columns and print summary
        run: python src/register_data.py --data data/SuperKart.csv

  data-preparation:
    name: 2 - Data cleaning and train/test split
    runs-on: ubuntu-latest
    needs: data-registration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Clean data and create train/test splits
        run: python src/data_prep.py --data data/SuperKart.csv --out artifacts
      - name: Upload splits as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: train-test-data
          path: artifacts/

  model-training:
    name: 3 - Model tuning, tracking and evaluation
    runs-on: ubuntu-latest
    needs: data-preparation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download train/test artifact
        uses: actions/download-artifact@v4
        with:
          name: train-test-data
          path: artifacts/
      - name: Tune models and log experiments with MLflow
        run: python src/train_model.py --artifacts artifacts --model-out model/best_model.joblib
      - name: Upload model and experiment logs
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: |
            model/
            mlflow.db

  commit-model:
    name: 4 - Commit best model to main
    runs-on: ubuntu-latest
    needs: model-training
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: .
      - name: Commit and push updated model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add model/best_model.joblib model/metrics.json
          git diff --cached --quiet || git commit -m "Update trained model [skip ci]"
          git push origin main
